baseURL = 'https://blog.gereader.xyz'
languageCode = 'en-us'
title = "Gene Reader"
theme = "hugo-blog-awesome"
enableRobotsTXT = true

[params]
  goToTop = true
  defaultColor = "auto"
  description = "Gene Reader — notes from a platform engineer."
  tagline = "Notes from a platform engineer."
  renderAnchorLinks = true
  featuredProjects = ["autocon4", "intro-to-clab", "rss-news-aggregator"]
  contentLicense = "CC BY 4.0"
  contentLicenseURL = "https://creativecommons.org/licenses/by/4.0/"
  mainSections = ["posts"]

[params.author]
  avatar = "images/MyFace.jpeg"
  intro = "Gene Reader"
  name = "Gene Reader"
  email = "eugene.reader@gmail.com"
  description = "Platform engineer focused on automation and reliability. I write about things I broke, things I fixed, and mistakes I want to avoid repeating."

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/gereader"

[[params.socialIcons]]
  name = "linkedin"
  url = "https://linkedin.com/in/GeReader"

[menu]
  [[menu.main]]
    pageRef = "/"
    name = "Home"
    url = "/"
    weight = 10

  [[menu.main]]
    name = "Projects"
    url = "/projects/"
    weight = 20

  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 30

  [[menu.main]]
    name = "Tags"
    url = "/tags/"
    weight = 40

  [[menu.main]]
    name = "RSS"
    url = "/index.xml"
    weight = 50

[services.disqus]
  shortname = "blog-gereader-xyz"

[frontmatter]
  format = "yaml"

[params.seo]
  title = "Gene Reader"
  description = "Blog about platform engineering, automation, CI/CD, AWS, and things built, broken, and fixed along the way."

[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      autoHeadingID = true

    [markup.goldmark.renderer]
      unsafe = true

    [markup.tableOfContents]
      startLevel = 2
      endLevel = 4

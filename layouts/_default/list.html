{{- define "main" -}}
<div class="wrapper list-page">
    <header class="header">
        <h1 class="header-title center">{{ .Title }}</h1>
    </header>
    <main id="main-content" class="page-content" aria-label="Content" tabindex="-1">
        {{ range .Pages.GroupByDate "2006" }}
        {{ $year := .Key }}
        <h2 class="post-year">{{ $year }}</h2>

        {{ range .Pages }}
        {{ partial "postCard" . }}
        {{ end }}

        {{ end }}
    </main>
</div>
{{- end -}}

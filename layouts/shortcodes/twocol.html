<div class="twocol"
     style="display:grid;grid-template-columns:2fr 3fr;gap:1rem;align-items:start;margin:1rem 0;">
  <div class="twocol-left" style="font-size:1.8rem;font-weight:700;">
    {{ .Inner | markdownify }}
  </div>
  <div class="twocol-right">
    {{ .Get "right" | markdownify }}
  </div>
</div>

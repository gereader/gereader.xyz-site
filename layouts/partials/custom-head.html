{{ if .Params.renderMermaid }}
  <script defer src="{{ "js/mermaid.min.js" | relURL }}"></script>
  <script defer>
    (function () {
      function isDark() {
        var html = document.documentElement;
        if (html.classList.contains('dark')) return true;
        if (html.classList.contains('light')) return false;
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      }
      function themeVars() {
        var cs = getComputedStyle(document.documentElement);
        function v(name) { return cs.getPropertyValue(name).trim(); }
        var surface0 = v('--ctp-surface0');
        var surface1 = v('--ctp-surface1');
        var mantle = v('--ctp-mantle');
        var text = v('--color-text');
        var muted = v('--color-text-muted');
        var lavender = v('--ctp-lavender');
        var overlay1 = v('--ctp-overlay1');
        var overlay0 = v('--ctp-overlay0');
        var bgElev = v('--color-bg-elev');
        return {
          background: 'transparent',
          mainBkg: surface0,
          primaryColor: surface0,
          primaryTextColor: text,
          primaryBorderColor: lavender,
          secondaryColor: surface1,
          secondaryTextColor: text,
          secondaryBorderColor: lavender,
          tertiaryColor: mantle,
          tertiaryTextColor: text,
          tertiaryBorderColor: overlay0,
          nodeBorder: lavender,
          nodeTextColor: text,
          textColor: text,
          titleColor: text,
          lineColor: overlay1,
          defaultLinkColor: overlay1,
          edgeLabelBackground: bgElev,
          labelTextColor: text,
          clusterBkg: mantle,
          clusterBorder: overlay0
        };
      }
      function render() {
        if (typeof window.mermaid === 'undefined') return;
        var blocks = Array.from(document.querySelectorAll('.mermaid'));
        if (!blocks.length) return;
        blocks.forEach(function (el) {
          var src = el.dataset.mermaidSource;
          if (src) el.textContent = src;
          el.removeAttribute('data-processed');
        });
        try {
          window.mermaid.initialize({
            startOnLoad: false,
            theme: 'base',
            themeVariables: themeVars(),
            securityLevel: 'loose',
            fontFamily: getComputedStyle(document.documentElement).getPropertyValue('--font-sans').trim()
          });
        } catch (e) {
          console.error('[mermaid] initialize failed:', e);
        }
        blocks.forEach(function (el) {
          window.mermaid.run({ nodes: [el] })
            .then(function () { el.classList.add('ready'); })
            .catch(function (err) {
              console.error('[mermaid] render failed:', err, el);
              el.classList.add('ready');
            });
        });
      }
      function whenReady(fn) {
        if (document.readyState !== 'loading') fn();
        else document.addEventListener('DOMContentLoaded', fn);
      }
      whenReady(function () {
        var poll = setInterval(function () {
          if (typeof window.mermaid !== 'undefined') { clearInterval(poll); render(); }
        }, 30);
        new MutationObserver(function (muts) {
          for (var i = 0; i < muts.length; i++) {
            if (muts[i].attributeName === 'class') { render(); break; }
          }
        }).observe(document.documentElement, { attributes: true });
      });
    })();
  </script>
{{ end }}

{{ if .Params.renderAnchorLinks }}
  <script src="https://cdn.jsdelivr.net/npm/anchor-js/anchor.min.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      var anchors = new AnchorJS();
      anchors.options = { icon: '#' };
      anchors.add('h2, h3, h4');
    });
  </script>
{{ end }}
